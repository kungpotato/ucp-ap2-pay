<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img"><title>ลำดับการเจรจาจ่ายเงินแบบ X402</title><desc>agent ขอราคาแล้วได้ HTTP 402 กลับมา, ไปจ่ายเงินบนเชนเอง แล้วนำ tx hash กลับมายืนยันกับ backend อีกครั้ง</desc>
<g class="c-purple"><rect x="30" y="20" width="140" height="40" rx="4" class="box"/><text x="100" y="45" text-anchor="middle" class="th">Agent</text></g>
<g class="c-teal"><rect x="280" y="20" width="140" height="40" rx="4" class="box"/><text x="350" y="45" text-anchor="middle" class="th">Backend</text></g>
<g class="c-blue"><rect x="530" y="20" width="140" height="40" rx="4" class="box"/><text x="600" y="45" text-anchor="middle" class="th">Anvil fork</text></g>
<line x1="100" y1="60" x2="100" y2="320" class="leader"/>
<line x1="350" y1="60" x2="350" y2="320" class="leader"/>
<line x1="600" y1="60" x2="600" y2="320" class="leader"/>

<line x1="100" y1="90" x2="350" y2="90" class="arr"/>
<text x="225" y="82" text-anchor="middle" class="ts">1. POST /x402/.../pay (ไม่มี header)</text>
<line x1="350" y1="115" x2="100" y2="115" class="arr"/>
<text x="225" y="107" text-anchor="middle" class="ts">402 + ราคา/ที่อยู่ที่ต้องจ่าย</text>

<line x1="100" y1="155" x2="600" y2="155" class="arr"/>
<text x="350" y="147" text-anchor="middle" class="ts">2. approve + Settlement.pay(orderId, amount)</text>
<line x1="600" y1="180" x2="100" y2="180" class="arr"/>
<text x="350" y="172" text-anchor="middle" class="ts">tx ยืนยันบนเชน → ได้ tx hash</text>

<line x1="100" y1="220" x2="350" y2="220" class="arr"/>
<text x="225" y="212" text-anchor="middle" class="ts">3. POST /x402/.../pay (X-Payment: tx hash)</text>
<line x1="350" y1="245" x2="600" y2="245" class="leader"/>
<text x="475" y="237" text-anchor="middle" class="ts">อ่าน receipt + ตรวจ event log</text>
<line x1="350" y1="280" x2="100" y2="280" class="arr"/>
<text x="225" y="272" text-anchor="middle" class="ts">200 order.status = paid</text>
</svg>