<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img"><title>ลำดับการสร้าง AP2 mandate chain</title><desc>มนุษย์ขอ intent mandate, ต่อด้วย cart mandate ที่ backend ตรวจงบให้ก่อนเซ็น, แล้วมนุษย์อนุมัติ payment mandate เป็นขั้นสุดท้าย</desc>
<g class="c-gray"><rect x="70" y="20" width="160" height="40" rx="4" class="box"/><text x="150" y="45" text-anchor="middle" class="th">มนุษย์ (ผู้ซื้อ)</text></g>
<g class="c-gray"><rect x="420" y="20" width="160" height="40" rx="4" class="box"/><text x="500" y="45" text-anchor="middle" class="th">Backend (merchant)</text></g>
<line x1="150" y1="60" x2="150" y2="300" class="leader"/>
<line x1="500" y1="60" x2="500" y2="300" class="leader"/>

<line x1="150" y1="90" x2="500" y2="90" class="arr"/>
<text x="325" y="82" text-anchor="middle" class="ts">1. POST intent-mandate (งบ + คำค้น)</text>
<line x1="500" y1="115" x2="150" y2="115" class="arr"/>
<text x="325" y="107" text-anchor="middle" class="ts">intent mandate เซ็นด้วยกุญแจผู้ซื้อ</text>

<line x1="150" y1="155" x2="500" y2="155" class="arr"/>
<text x="325" y="147" text-anchor="middle" class="ts">2. POST cart-mandate (แนบ intent id)</text>
<line x1="500" y1="180" x2="150" y2="180" class="arr"/>
<text x="325" y="172" text-anchor="middle" class="ts">ตรวจงบ+expiry แล้วเซ็น หรือ 403 ถ้าเกินงบ</text>

<line x1="150" y1="220" x2="500" y2="220" class="arr"/>
<text x="325" y="212" text-anchor="middle" class="ts">3. POST payment-mandate (อนุมัติจ่าย)</text>
<line x1="500" y1="245" x2="150" y2="245" class="arr"/>
<text x="325" y="237" text-anchor="middle" class="ts">payment mandate เซ็น → order = pending_payment</text>
</svg>