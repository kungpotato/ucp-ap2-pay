<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img"><title>ลำดับการ agent self-checkout แบบครบวงจร</title><desc>มนุษย์กดปุ่มเดียว แล้ว backend สวมบทบาท agent ทำทุกขั้นตอนของ X402 และ on-chain settlement เองจนจบ</desc><style>
text{font-family:-apple-system,"Helvetica Neue","Noto Sans Thai",Arial,sans-serif;}
.box{fill:#ffffff;stroke-width:1.5;}
.th{font-size:13px;font-weight:600;fill:#1f2937;}
.ts{font-size:11px;fill:#4b5563;}
.arr{stroke:#9ca3af;stroke-width:1.5;fill:none;}
.leader{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:3,3;fill:none;}
.c-gray .box{stroke:#6b7280;fill:#f3f4f6;}
.c-purple .box{stroke:#7c3aed;fill:#f3e8ff;}
.c-teal .box{stroke:#0d9488;fill:#ccfbf1;}
.c-coral .box{stroke:#f97316;fill:#ffedd5;}
.c-pink .box{stroke:#db2777;fill:#fce7f3;}
.c-blue .box{stroke:#2563eb;fill:#dbeafe;}
</style>
<g class="c-gray"><rect x="30" y="20" width="160" height="40" rx="4" class="box"/><text x="110" y="45" text-anchor="middle" class="th">มนุษย์ (frontend)</text></g>
<g class="c-teal"><rect x="300" y="20" width="160" height="40" rx="4" class="box"/><text x="380" y="45" text-anchor="middle" class="th">Backend = agent</text></g>
<g class="c-blue"><rect x="540" y="20" width="140" height="40" rx="4" class="box"/><text x="610" y="45" text-anchor="middle" class="th">Anvil + Settlement</text></g>
<line x1="110" y1="60" x2="110" y2="260" class="leader"/>
<line x1="380" y1="60" x2="380" y2="260" class="leader"/>
<line x1="610" y1="60" x2="610" y2="260" class="leader"/>

<line x1="110" y1="90" x2="380" y2="90" class="arr"/>
<text x="245" y="82" text-anchor="middle" class="ts">POST /agent/orders/{id}/checkout</text>

<line x1="380" y1="140" x2="610" y2="140" class="arr"/>
<text x="495" y="132" text-anchor="middle" class="ts">approve + Settlement.pay() (ผ่าน cast)</text>
<line x1="610" y1="170" x2="380" y2="170" class="arr"/>
<text x="495" y="162" text-anchor="middle" class="ts">receipt: OrderSettled ✓</text>

<line x1="380" y1="215" x2="110" y2="215" class="arr"/>
<text x="245" y="207" text-anchor="middle" class="ts">200 {status: paid, tx_hash}</text>
</svg>